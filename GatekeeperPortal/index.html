<!DOCTYPE html>
<html lang="en">
<head>
    <!--May 23, 2026-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatekeeper Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="GatekeeperPortal.css">
</head>
<body>


    <main>
        <!--LANDING SCREEN DIV-->
        <div id="landing-screen-div">
            <p class="title">GATEKEEPER PORTAL</p>

            <p>
                A secure, member-only skeletop website.
                <br>
                Experience authentication at its purest form.
            </p>

            <button id="start-btn">Start</button>
        </div>


        <!--AUTH DIV-->
        <div id="auth-div" class="hidden-div">
            <p id="auth-title"></p>

            <form id="auth-form">
                <input id="email-input" placeholder="Email">
                <input id="password-input" placeholder="Password">
                <button id="auth-btn"></button>
            </form>

            <p id="auth-account-text"><span id="account-instead-text"></span> instead.</p>

            <button id="back-btn">Back to Landing Screen</button>
        </div>


        <!--DASHBOARD DIV-->
        <div id="dashboard-div" class="hidden-div">
            <p class="dashboard-text">DASHBOARD</p>
            <p id="welcome-msg-display"></p>

            <button id="update-password-btn"></button>
            <button>Log Out</button>
        </div>


        <!--UPDATE PASSWORD DIV-->
        <div id="update-password" class="hidden-div">
            <p>Update Password</p>

            <form id="update-password-form">
                <input id="new-password-input" placeholder="New Password">
                <button type="submit">Update Password</button>
            </form>
        </div>
    </main>


    <script src="GatekeeperPortal.js"></script>
    
</body>
</html>

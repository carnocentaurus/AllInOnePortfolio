<!DOCTYPE html>
<html lang="en">
<head>
    <!--May 31, 2026-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Ledger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="VaultLedger.css">
</head>
<body>


    <main>
        <!--AUTH DIV-->
        <div id="auth-div">
            <p class="big-text">AUTHENTICATE</p>

            <p id="auth-title"></p>

            <form id="auth-form">
                <input id="email-input" type="email" placeholder="Email">
                <input id="password-input" type="password" placeholder="Password">
                <button id="auth-btn"></button>
            </form>

            <p id="auth-account-text">Dont have an account? <span id="auth-instead-text">Sign Up</span> instead</p>

            <button>Back to Home</button>
        </div>


        <!--DASHBOARD DIV-->
        <div id="dashboard-div">
            <p class="big-text">DASHBOARD</p>

            <p id="current-balance-display"></p>

            <button>Withdraw</button>
            <button>Deposit</button>
            <button>Manage Account</button>
            <button>Log Out</button>

            <button>Back to Home</button>
        </div>


        <!--WITHDRAW DIV--> 
        <div id="withdraw-div">
            <p class="big-text">WITHDRAW</p>

            <input id="withdraw-input" type="number" placeholder="Amount">
            <button>Withdraw</button>

            <button>Cancel</button>
        </div>


        <!--DEPOSIT DIV--> 
        <div id="deposit-div">
            <p class="big-text">DEPOSIT</p>

            <input id="deposit-input" type="number" placeholder="Amount">
            <button>Deposit</button>

            <button>Cancel</button>
        </div>


        <!--MANAGE ACCOUNT DIV-->
        <div id="manage-account-div">
            <p class="big-text">MANAGE ACCOUNT</p>

            <button>Change Email</button>
            <button>Change Password</button>

            <button>Go Back</button>
        </div>
    </main>


    <script type="module" src="main.js"></script>
    
</body>
</html>
